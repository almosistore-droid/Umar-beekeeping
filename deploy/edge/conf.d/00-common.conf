# Shared by all client sites.
# Compress text answers (JSON lists, scripts, styles): much less mobile data at the apiary
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
ssl_session_cache shared:SSL:10m;
ssl_protocols TLSv1.2 TLSv1.3;
client_max_body_size 20m;
# Docker DNS: client containers are found when a request comes, so a stopped client does not stop nginx
resolver 127.0.0.11 valid=10s ipv6=off;

# Unknown domains (or the bare IP): close the connection
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

include /etc/nginx/sites/*.conf;
