# Shared HTTPS entrance for all clients on this server (one nginx on ports 80/443).
# Each client's site is a generated file in deploy/edge/sites/<slug>.conf (see deploy/client.sh).
name: bee-edge

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: bee-edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./sites:/etc/nginx/sites:ro
      - ../../nginx/proxy_params_bee:/etc/nginx/proxy_params_bee:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks: [edge]

networks:
  edge:
    external: true
    name: bee-edge
