# Local testing on a laptop: no domain, no HTTPS, no nginx.
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:5173  (API docs: http://localhost:8000/api/docs)
# Values come from .env when present, otherwise safe local defaults below.
name: beekeeping-dev

services:
  postgres:
    restart: unless-stopped  # back up by itself after sleep / Docker Desktop start
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bee
      POSTGRES_PASSWORD: bee
      POSTGRES_DB: beekeeping
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bee -d beekeeping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    restart: unless-stopped  # back up by itself after sleep / Docker Desktop start
    build: ./backend
    entrypoint: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://bee:bee@postgres:5432/beekeeping
      # Your real bot token from .env is used if set (needed to test inside Telegram)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-1234567890:local-test-token}
      # Used in hive QR links: https://t.me/<bot>/<app>?startapp=hive_<uuid>
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBAPP_SHORT_NAME: ${TELEGRAM_WEBAPP_SHORT_NAME:-}
      CURRENCY: ${CURRENCY:-смн}
      JWT_SECRET: local-dev-secret-local-dev-secret-0123456789
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-111111}
      DEFAULT_USER_ROLE: VIEWER
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: "604800"
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped  # back up by itself after sleep / Docker Desktop start
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      VITE_POLL: "1"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Optional HTTPS tunnel for opening the app inside Telegram from this laptop:
  #   docker compose -f docker-compose.dev.yml --profile telegram up -d --build
  # It sets the new https://….trycloudflare.com address on the bot's menu button by itself
  # (needs the real TELEGRAM_BOT_TOKEN in .env) and creates a new address when the old one dies.
  # Current address: docker compose -f docker-compose.dev.yml logs tunnel | findstr trycloudflare
  tunnel:
    build: ./tunnel
    profiles: ["telegram"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TUNNEL_TARGET: http://frontend:5173
      MENU_BUTTON_TEXT: Пасека
    restart: unless-stopped
    depends_on:
      - frontend

volumes:
  pgdata-dev:
  frontend-node-modules:
