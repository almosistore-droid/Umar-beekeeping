# Local testing on a laptop: no domain, no HTTPS, no nginx.
#   docker compose -f docker-compose.dev.yml up --build
#   open http://localhost:5173  (API docs: http://localhost:8000/api/docs)
# Values come from .env when present, otherwise safe local defaults below.
name: beekeeping-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bee
      POSTGRES_PASSWORD: bee
      POSTGRES_DB: beekeeping
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bee -d beekeeping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    entrypoint: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://bee:bee@postgres:5432/beekeeping
      # Your real bot token from .env is used if set (needed to test inside Telegram)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-1234567890:local-test-token}
      JWT_SECRET: local-dev-secret-local-dev-secret-0123456789
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-111111}
      DEFAULT_USER_ROLE: VIEWER
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: "604800"
      CORS_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # Optional HTTPS tunnel for opening the app inside Telegram from this laptop:
  #   docker compose -f docker-compose.dev.yml --profile telegram up --build
  # then find "https://....trycloudflare.com" in the log (docker compose ... logs tunnel)
  # and put it into @BotFather -> Bot Settings -> Menu Button.
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["telegram"]
    command: tunnel --no-autoupdate --url http://frontend:5173
    depends_on:
      - frontend

volumes:
  pgdata-dev:
  frontend-node-modules:
